interface:
  display_name: "Stitch Design MD"
  short_description: "Extract a semantic system from Stitch screens"
  default_prompt: "Use $stitch-design-md to extract an evidence-backed visual system from these Stitch screens without changing downstream implementation authority."

dependencies:
  tools:
    - type: "mcp"
      value: "stitch"
      description: "Google Stitch MCP server with project and screen retrieval tools"
      transport: "streamable_http"
      url: "https://stitch.googleapis.com/mcp"

policy:
  allow_implicit_invocation: true
